        const numBadge = el('span', 'wardrobe-num', { text: String(aIdx + 1) });
        const img = el('img', '', { style: 'display:none;', alt: 'תמונת הלבשה' });
        const placeholder = el('span', 'wardrobe-placeholder', { text: '📷' });
        thumbWrap.appendChild(img);
        thumbWrap.appendChild(placeholder);
        thumbWrap.appendChild(numBadge);
        const photoKey = item.wardrobePhotos[actor.id];
        if (photoKey) {
          getPhoto(photoKey).then(dataUrl => {
            if (dataUrl) { img.src = dataUrl; img.style.display = 'block'; placeholder.style.display = 'none'; }
          }).catch(() => {});
        }
        const fileInput = el('input', 'wardrobe-file', { type: 'file', accept: 'image/*', style: 'display:none;' });
        fileInput.addEventListener('change', () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            const key = item.id + '_' + actor.id;
            savePhoto(key, dataUrl).then(() => {
              item.wardrobePhotos[actor.id] = key;
              img.src = dataUrl; img.style.display = 'block'; placeholder.style.display = 'none';
              scheduleSave();
            }).catch(() => { showAlert('שגיאה בשמירת התמונה — ייתכן שאין מקום פנוי בדפדפן.'); });
          };
          reader.readAsDataURL(file);
        });
        thumbWrap.addEventListener('click', () => fileInput.click());
        box.appendChild(thumbWrap);
        box.appendChild(fileInput);
        wrap.appendChild(box);
      });
      return wrap;
    }

    function renderSchedule() {
      tbody.innerHTML = '';
      const computedTimes = computeScheduleTimes(day);
      day.schedule.forEach((item, idx) => {
        const tr = el('tr', item.type === 'break' ? 'break-row' : 'scene-row');
        if (item.type === 'break') {
          const td = el('td');
          td.colSpan = scheduleColumns.length;
          const innerWrap = el('div', 'break-inner');
          const timeDisplay = el('span', 'break-time', { text: formatComputedRange(computedTimes[idx]), 'data-time-idx': idx });
          const labelInput2 = el('input', 'break-label', { placeholder: 'הפסקת צהריים / הקמות תאורה / הגעת צוות...' });
          labelInput2.value = item.label;
          labelInput2.addEventListener('input', () => { item.label = labelInput2.value; scheduleSave(); });
          const minInput = el('input', 'break-minutes', { placeholder: 'דק\'' });
          minInput.value = item.minutes;
          minInput.addEventListener('input', () => { item.minutes = minInput.value; updateComputedTimes(); scheduleSave(); });
          innerWrap.appendChild(minInput);
          innerWrap.appendChild(timeDisplay);
          innerWrap.appendChild(labelInput2);
          td.appendChild(innerWrap);
          tr.appendChild(td);
        } else {
          scheduleColumns.forEach(col => {
            const td = el('td', col.cls);
            let inputEl;
            if (col.type === 'io') {
              inputEl = el('select', 'io-select ' + (item.io === 'ח' ? 'io-ext' : 'io-int'));
              ['ח','פ'].forEach(v => {
                const opt = el('option', '', { value: v, text: v });
                if (item.io === v) opt.selected = true;
                inputEl.appendChild(opt);
              });
              inputEl.addEventListener('change', () => {
                item.io = inputEl.value;
                inputEl.className = 'io-select ' + (inputEl.value === 'ח' ? 'io-ext' : 'io-int');
                scheduleSave();
              });
            } else if (col.type === 'daynight') {
              inputEl = el('select', 'dn-select ' + (item.dayNight === 'לילה' ? 'dn-night' : 'dn-day'));
              ['יום','לילה'].forEach(v => {
                const opt = el('option', '', { value: v, text: v });
                if (item.dayNight === v) opt.selected = true;
                inputEl.appendChild(opt);
              });
              inputEl.addEventListener('change', () => {
                item.dayNight = inputEl.value;
                inputEl.className = 'dn-select ' + (inputEl.value === 'לילה' ? 'dn-night' : 'dn-day');
                scheduleSave();
              });
            } else if (col.type === 'textarea') {
              inputEl = el('textarea', '');
              inputEl.value = item[col.key] || '';
              inputEl.addEventListener('input', () => { item[col.key] = inputEl.value; autosizeTextarea(inputEl); scheduleSave(); });
            } else if (col.type === 'minutes') {
              inputEl = el('input', 'minutes-input', { type: 'text', placeholder: 'דק\'' });
              inputEl.value = item[col.key] || '';
              inputEl.addEventListener('input', () => { item[col.key] = inputEl.value; updateComputedTimes(); scheduleSave(); });
            } else if (col.type === 'computed') {
              inputEl = el('div', 'computed-time', { text: formatComputedRange(computedTimes[idx]), 'data-time-idx': idx });
            } else if (col.type === 'actors') {
              inputEl = buildActorsCell(item, tr);
            } else if (col.type === 'extras') {
              inputEl = buildExtrasCell(item);
            } else if (col.type === 'wardrobe') {
              inputEl = buildWardrobeCell(item, tr);
            } else {
              inputEl = el('input', '', { type: 'text', placeholder: col.placeholder || '' });
              inputEl.value = item[col.key] || '';
              inputEl.addEventListener('input', () => {
                item[col.key] = inputEl.value;
                if (col.key === 'sceneNum') updateDayTotals(); // keeps the day-meta "סצנות" summary in sync
                scheduleSave();
              });
            }
            td.appendChild(inputEl);
            tr.appendChild(td);
          });
        }
        // actions cell
        const actionsTd = el('td', 'col-actions');
        const actionsWrap = el('div', 'row-actions-cell');
        const upBtn = el('button', 'icon-btn move', { type: 'button', title: 'הזזה למעלה', text: '↑' });
        upBtn.addEventListener('click', () => {
          if (idx === 0) return;
          [day.schedule[idx-1], day.schedule[idx]] = [day.schedule[idx], day.schedule[idx-1]];
          renderSchedule(); scheduleSave();
        });
        const downBtn = el('button', 'icon-btn move', { type: 'button', title: 'הזזה למטה', text: '↓' });
        downBtn.addEventListener('click', () => {
          if (idx === day.schedule.length - 1) return;
          [day.schedule[idx+1], day.schedule[idx]] = [day.schedule[idx], day.schedule[idx+1]];
          renderSchedule(); scheduleSave();
        });
        const delBtn = el('button', 'icon-btn', { type: 'button', title: 'הסרה', text: '✕' });
        delBtn.addEventListener('click', () => {
          day.schedule.splice(idx, 1);
          if (day.schedule.length === 0) day.schedule.push(blankScene());
          renderSchedule(); scheduleSave();
        });
        actionsWrap.appendChild(upBtn);
        actionsWrap.appendChild(downBtn);
        actionsWrap.appendChild(delBtn);
        actionsTd.appendChild(actionsWrap);
        tr.appendChild(actionsTd);
        tbody.appendChild(tr);
      });
      updateDayTotals();
    }
    renderSchedule();

    const addGroup = el('div', 'add-row-group');
    const addSceneBtn = el('button', 'add-row', { type: 'button', text: '+ הוספת סצנה' });
    addSceneBtn.addEventListener('click', () => { day.schedule.push(blankScene()); renderSchedule(); scheduleSave(); });
    const addBreakBtn = el('button', 'add-row', { type: 'button', text: '+ הוספת הפסקה / אירוע (הקמת תאורה, ארוחה וכו\')' });
    addBreakBtn.addEventListener('click', () => { day.schedule.push(blankBreak()); renderSchedule(); scheduleSave(); });
    addGroup.appendChild(addSceneBtn);
    addGroup.appendChild(addBreakBtn);
    schedCard.appendChild(addGroup);
    frag.appendChild(schedCard);

    // notes card
    const notesCard = el('section', 'card');
    notesCard.appendChild(el('h2', '', { text: 'הערות כלליות' }));
    const notesArea = el('textarea', '', { placeholder: 'הנחיות בטיחות, קוד לבוש, הערות מיוחדות ליום הצילום...' });
    bindSimple(day, 'notes', notesArea);
    notesArea.addEventListener('input', () => autosizeTextarea(notesArea));
    notesCard.appendChild(notesArea);
    frag.appendChild(notesCard);

    return frag;
  }

  function buildSimpleRow(item, fieldsSpec, rowClass, onDelete) {
    const row = el('div', 'row ' + rowClass);
    fieldsSpec.forEach(spec => {
      const input = el('input', '', { type: spec.type || 'text', placeholder: spec.placeholder || '' });
      input.value = item[spec.key] || '';
      input.addEventListener('input', () => { item[spec.key] = input.value; scheduleSave(); });
      row.appendChild(fieldBlock(spec.label, input));
    });
    const delBtn = el('button', 'icon-btn', { type: 'button', title: 'הסרה', text: '✕' });
    delBtn.addEventListener('click', onDelete);
    row.appendChild(delBtn);
    return row;
  }

  /* ---------- backup: export / import (full state + photos, as one JSON file) ---------- */
  function collectAllPhotoKeys() {
    const keys = new Set();
    state.days.forEach(d => (d.schedule || []).forEach(item => {
      if (item.wardrobePhotos) Object.values(item.wardrobePhotos).forEach(k => k && keys.add(k));
    }));
    return Array.from(keys);
  }

  async function exportBackup() {
    const statusEl = document.getElementById('saveStatus');
    try {
      statusEl.textContent = 'מכין גיבוי…';
      const keys = collectAllPhotoKeys();
      const photos = {};
      for (const k of keys) {
        const dataUrl = await getPhoto(k);
        if (dataUrl) photos[k] = dataUrl;
      }
      const exportObj = { kind: 'callsheet-backup', version: 2, exportedAt: new Date().toISOString(), state, photos };
      const blob = new Blob([JSON.stringify(exportObj)], { type: 'application/json' });
      const dateStr = new Date().toISOString().slice(0, 10);
      const safeTitle = (state.prodTitle || 'קולשיט').replace(/[^\u0590-\u05FFa-zA-Z0-9]+/g, '_') || 'קולשיט';
      await saveFile({ filename: 'גיבוי_' + safeTitle + '_' + dateStr + '.json', data: blob });
      statusEl.textContent = 'גיבוי נשמר';
    } catch (e) {
      if (e && e.code === 'declined') { statusEl.textContent = 'בוטל'; return; }
      console.error('export failed', e);
      await showAlert('שגיאה בהכנת קובץ הגיבוי.');
      statusEl.textContent = 'שגיאה';
    }
  }

  function getActiveDay() {
    return state.days.find(d => d.id === state.activeDayId) || state.days[0];
  }

  function getRowBoundaries(container, scale) {
    const rect = container.getBoundingClientRect();
    const boundaries = new Set();
    container.querySelectorAll('tr, section.card').forEach(elx => {
      const r = elx.getBoundingClientRect();
      boundaries.add(Math.round((r.top - rect.top) * scale));
      boundaries.add(Math.round((r.bottom - rect.top) * scale));
    });
    return Array.from(boundaries).sort((a, b) => a - b);
  }

  // Slices one captured canvas across as many PDF pages as it needs, snapping
  // each break to a row/card boundary so nothing is cut in half. pageFormat
  // (if given) is used for every new page this call adds, so the schedule's
  // pages can be physically wider than the cover's pages — that is what keeps
  // its columns close to full size instead of shrinking to match the cover.
  function addCanvasPages(pdf, canvas, rowBoundaries, usableW, usableH, pagePixelHeight, scale, margin, isFirstPageOfDoc, pageFormat) {
    // leave a small safety margin below the theoretical per-page capacity —
    // html2canvas renders wrapped text through its own internal cloning
    // pipeline, which can differ from our own DOM measurements by a few
    // pixels, and without this slack a row that "just barely" fits can still
    // end up sliced across the page boundary
    const SAFE_PX = Math.round(pagePixelHeight * 0.03);
    let renderedPx = 0;
    let pageIndex = 0;
    while (renderedPx < canvas.height) {
      let sliceEnd = Math.min(renderedPx + pagePixelHeight - SAFE_PX, canvas.height);
      const isLastSlice = sliceEnd >= canvas.height;
      if (!isLastSlice) {
        // snap the break to the last row/card boundary that fits — a whole
        // row/scene that doesn't fit is pushed entirely to the next page
        // (leaving blank space below it here) rather than being sliced in
        // half. The lower bound only skips a boundary that lands right on
        // the page's own top edge (which would produce a near-zero-height
        // page); it must stay small or a real, closer boundary gets missed
        // and the code falls through to a hard, mid-row cut instead.
        const candidates = rowBoundaries.filter(b => b > renderedPx + 6 && b <= sliceEnd);
        if (candidates.length) sliceEnd = candidates[candidates.length - 1];
        // if no boundary at all fits in this page, the row/card itself is
        // taller than one full page (very long text) — there is truly no
        // page break that avoids cutting it, so it is left to spill over
      }
      const sliceHeightPx = sliceEnd - renderedPx;
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = sliceHeightPx;
      const sctx = sliceCanvas.getContext('2d');
      sctx.fillStyle = '#ffffff';
      sctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
      sctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
      const sliceData = sliceCanvas.toDataURL('image/jpeg', 0.92);
      if (!(isFirstPageOfDoc && pageIndex === 0)) {
        if (pageFormat) pdf.addPage(pageFormat, 'landscape'); else pdf.addPage();
      }
      const sliceHeightPt = sliceHeightPx / scale;
      pdf.addImage(sliceData, 'JPEG', margin, margin, usableW, sliceHeightPt);
      renderedPx = sliceEnd;
      pageIndex++;
    }
  }

  // Adds one full page containing exactly one image, scaled up (keeping its
  // aspect ratio) to fill as much of the page as possible — used whenever a
  // canvas is already known to fit on one page, so it never prints tiny and
  // half-empty.
  function addFittedImagePage(pdf, canvas, pageW, pageH, margin, isFirstPageOfDoc, pageFormat) {
    const usableW = pageW - margin * 2;
    const usableH = pageH - margin * 2;
    const PX_TO_PT = 0.375; // canvas was captured at scale:2 (2 canvas px per CSS px), and 1 CSS px = 0.75pt
    const naturalW = canvas.width * PX_TO_PT;
    const naturalH = canvas.height * PX_TO_PT;
    const containScale = Math.min(usableW / naturalW, usableH / naturalH);
    const finalW = naturalW * containScale;
    const finalH = naturalH * containScale;
    const offsetX = margin + (usableW - finalW) / 2;
    const offsetY = margin + (usableH - finalH) / 2;
    if (!isFirstPageOfDoc) {
      if (pageFormat) pdf.addPage(pageFormat, 'landscape'); else pdf.addPage();
    }
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(imgData, 'JPEG', offsetX, offsetY, finalW, finalH);
  }

  // Places a captured canvas onto page(s) sized pageW x pageH. When the whole
  // canvas fits on a single page, it fills as much of the page as possible
  // (see addFittedImagePage) instead of leaving blank space below/beside it.
  // Content that needs more than one page falls back to width-fit slicing,
  // one row/card at a time.
  function renderCanvasToPdf(pdf, canvas, rowBoundaries, pageW, pageH, margin, isFirstPageOfDoc, pageFormat) {
    const usableW = pageW - margin * 2;
    const usableH = pageH - margin * 2;
    const widthFitScale = canvas.width / usableW; // canvas px per pt at full page width
    const heightAtWidthFit = canvas.height / widthFitScale;

    if (heightAtWidthFit <= usableH) {
      addFittedImagePage(pdf, canvas, pageW, pageH, margin, isFirstPageOfDoc, pageFormat);
      return;
    }

    const pagePixelHeight = Math.floor(usableH * widthFitScale);
    addCanvasPages(pdf, canvas, rowBoundaries, usableW, usableH, pagePixelHeight, widthFitScale, margin, isFirstPageOfDoc, pageFormat);
  }

  // html2canvas paints <input>/<textarea>/<select> using its own built-in
  // form-control renderer, which does not reliably wrap text to the box or
  // respect the page's right-to-left direction — that is what made typed
  // Hebrew text overflow past its box, or come out reading left-to-right,
  // in the exported PDF even though it looks correct on screen. Swapping
  // every field for a plain styled <div> with the same text right before
  // the screenshot lets html2canvas lay it out as ordinary text instead,
  // which it wraps and directs correctly.
  //
  // This is done on the LIVE page (temporarily), not via html2canvas's
  // "onclone" hook — a div can render at a very slightly different height
  // than the textarea it replaces (line-height/padding rounding), and doing
  // the swap only inside html2canvas's internal clone meant our own
  // row-boundary measurements (taken from the live textareas) no longer
  // matched the row heights actually rendered into the picture, which is
  // exactly what let a row get sliced across two pages. Swapping the live
  // DOM first means both the measurement and the screenshot see the same
  // element. Returns the list of {div, original} swaps to undo afterward.
  function swapFieldsForStaticText(rootEl) {
    const swaps = [];
    rootEl.querySelectorAll('input, textarea, select').forEach(fieldEl => {
      let text = '';
      if (fieldEl.tagName === 'SELECT') {
        const opt = fieldEl.options[fieldEl.selectedIndex];
        text = opt ? opt.textContent : '';
      } else {
        text = fieldEl.value || '';
      }
      const cs = getComputedStyle(fieldEl);
      const div = document.createElement('div');
      div.textContent = text;
      div.className = fieldEl.className;
      div.style.boxSizing = 'border-box';
      div.style.width = cs.width;
      div.style.minHeight = cs.height;
      div.style.font = cs.font;
      div.style.fontWeight = cs.fontWeight;
      div.style.color = cs.color;
      div.style.background = cs.backgroundColor;
      // set border sides individually (not the "border" shorthand) since a
      // few fields (e.g. the credit-chip role field) only style one side —
      // the shorthand's computed value is unreliable when sides differ
      div.style.borderTop = cs.borderTop;
      div.style.borderRight = cs.borderRight;
      div.style.borderBottom = cs.borderBottom;
      div.style.borderLeft = cs.borderLeft;
      div.style.borderRadius = cs.borderRadius;
      div.style.padding = cs.padding;
      div.style.textAlign = cs.textAlign;
      div.style.direction = 'rtl';
      div.style.unicodeBidi = 'plaintext';
      div.style.whiteSpace = fieldEl.tagName === 'TEXTAREA' ? 'pre-wrap' : 'normal';
      div.style.overflowWrap = 'break-word';
      div.style.wordBreak = 'break-word';
      fieldEl.replaceWith(div);
      swaps.push({ div, original: fieldEl });
    });
    return swaps;
  }
  function restoreFieldsFromStaticText(swaps) {
    // restore in reverse so nested swaps (rare) unwind cleanly
    for (let i = swaps.length - 1; i >= 0; i--) {
      const { div, original } = swaps[i];
      if (div.parentNode) div.replaceWith(original);
    }
  }

  /* ---------- PDF export: screenshot the active day (like print) into a real PDF file ----------
     The cover (credits, day info, locations, cast, notes) and the shooting
     schedule are captured as two SEPARATE images, each at its own natural
     width. The schedule then gets its own, wider page size in the PDF —
     scaled to the table's real width instead of squeezed down to match the
     narrower cover cards — so its columns stay close to full size and
     readable instead of shrinking to fit alongside everything else. */
  async function exportPDF() {
    const statusEl = document.getElementById('saveStatus');
    try {
      statusEl.textContent = 'מכין PDF…';

      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => window.html2canvas);
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => window.jspdf);

      const prevTheme = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', 'light');
      document.body.classList.add('pdf-export-mode');
      await new Promise(r => setTimeout(r, 50)); // let styles settle

      const { jsPDF } = window.jspdf;
      const margin = 32; // pt — keeps real whitespace around the content on every page
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
      const coverPageW = pdf.internal.pageSize.getWidth();
      const coverPageH = pdf.internal.pageSize.getHeight();

      const panel = document.querySelector('.day-panel.active');
      const scheduleEl = panel.querySelector('.schedule-section');
      // The production title and the "אנשי מפתח" credits card live above the
      // day tabs, shared by every day — not inside each day-panel — so
      // capturing just `panel` (as earlier versions did) always left them
      // out of the export. `.wrap` holds all of it: the title header, the
      // credits card, and (via #dayPanels) the active day panel — with every
      // *other* day panel already hidden by the .day-panel/.day-panel.active
      // CSS rule, and the day tabs themselves hidden by pdf-export-mode.
      const coverRoot = document.querySelector('.wrap');

      // ---- capture 1: title + credits + the active day's info cards —
      // everything except the schedule table (the "cover") ----
      const prevScheduleDisplay = scheduleEl.style.display;
      scheduleEl.style.display = 'none';
      const coverSwaps = swapFieldsForStaticText(coverRoot);
      // capture a few px wider than the element's own box — scrollWidth
      // excludes the element's border, so cropping the canvas to exactly
      // scrollWidth was clipping off the card's right-edge border line
      const coverCaptureWidth = Math.ceil(coverRoot.getBoundingClientRect().width) + 6;
      const coverCanvas = await window.html2canvas(coverRoot, {
        scale: 2, backgroundColor: '#ffffff', useCORS: true,
        windowWidth: Math.max(coverCaptureWidth, 1600), width: coverCaptureWidth
      });
      const coverScaleForRows = coverCanvas.width / coverRoot.getBoundingClientRect().width;
      const coverRowBoundaries = getRowBoundaries(coverRoot, coverScaleForRows);
      restoreFieldsFromStaticText(coverSwaps);
      scheduleEl.style.display = prevScheduleDisplay;
      renderCanvasToPdf(pdf, coverCanvas, coverRowBoundaries, coverPageW, coverPageH, margin, true, null);

      // ---- capture 2: the schedule table, one page's worth of ROWS at a
      // time. Earlier versions captured the whole table as one tall image
      // and sliced it by pixel position afterward — but html2canvas renders
      // wrapped text through its own internal pipeline, which can come out a
      // few pixels different from our own DOM measurements, and that was
      // enough to still slice through a row occasionally. Capturing each
      // page's rows as their OWN screenshot (every other row hidden) removes
      // that mismatch entirely: there is nothing to slice, so a row can
      // never end up split across two pages. The table itself also has a
      // fixed, narrow width per column now (table-layout: fixed — see the
      // CSS), so its total width is always the same regardless of screen
      // size; the card around it still defaults to stretching to fill its
      // container though, which previously left a blank gutter next to the
      // table — "hugging" the card to its content with fit-content removes
      // that ambiguity. ----
      scheduleEl.style.setProperty('width', 'fit-content', 'important');
      const otherChildren = Array.from(panel.children).filter(c => c !== scheduleEl);
      const hiddenPrev = otherChildren.map(c => c.style.display);
      otherChildren.forEach(c => { c.style.display = 'none'; });
      const scheduleSwaps = swapFieldsForStaticText(scheduleEl);

      const elementWidthPx = Math.ceil(scheduleEl.getBoundingClientRect().width);
      const schedPageW = Math.max(Math.round(elementWidthPx * 0.75) + margin * 2, coverPageW);
      const schedPageH = coverPageH;
      const schedUsableW = schedPageW - margin * 2;
      const schedUsableH = schedPageH - margin * 2;

      const tbodyEl = scheduleEl.querySelector('table.schedule tbody');
      const allRows = Array.from(tbodyEl.querySelectorAll('tr'));
      // Every page's screenshot includes more than just the rows — the card
      // title, the table header, and the wrapper's own border/padding are
      // captured on every page too, at a roughly constant height. The row
      // budget below has to leave room for that fixed overhead as well,
      // otherwise a page with fewer/shorter rows can still end up taller
      // than a full page once that overhead is added back in — and since
      // it no longer fits at full width, it gets scaled DOWN to fit the
      // page height instead, which is what "shrinks" that page.
      const totalRowsHeightPx = allRows.reduce((sum, tr) => sum + tr.getBoundingClientRect().height, 0);
      const overheadPx = Math.max(0, scheduleEl.getBoundingClientRect().height - totalRowsHeightPx);
      // A small extra safety margin (4%) absorbs the few-pixel differences
      // between our own DOM measurements and html2canvas's own rendering.
      const rowBudgetPx = Math.max(60, (schedUsableH * (elementWidthPx / schedUsableW) - overheadPx) * 0.96);
      const rowGroups = [];
      let currentGroup = [];
      let currentHeight = 0;
      allRows.forEach(tr => {
        const h = tr.getBoundingClientRect().height;
        if (currentGroup.length && currentHeight + h > rowBudgetPx) {
          rowGroups.push(currentGroup);
          currentGroup = [];
          currentHeight = 0;
        }
        currentGroup.push(tr);
        currentHeight += h;
      });
      if (currentGroup.length) rowGroups.push(currentGroup);

      for (const group of rowGroups) {
        const hiddenRows = allRows.filter(tr => !group.includes(tr));
        hiddenRows.forEach(tr => { tr.dataset.pdfPrevDisplay = tr.style.display; tr.style.display = 'none'; });
        const scheduleCaptureWidth = Math.ceil(scheduleEl.getBoundingClientRect().width) + 6;
        const groupCanvas = await window.html2canvas(scheduleEl, {
          scale: 2, backgroundColor: '#ffffff', useCORS: true,
          windowWidth: Math.max(scheduleCaptureWidth, 900), width: scheduleCaptureWidth
        });
        hiddenRows.forEach(tr => { tr.style.display = tr.dataset.pdfPrevDisplay; delete tr.dataset.pdfPrevDisplay; });
        addFittedImagePage(pdf, groupCanvas, schedPageW, schedPageH, margin, false, [schedPageW, schedPageH]);
      }

      restoreFieldsFromStaticText(scheduleSwaps);
      otherChildren.forEach((c, i) => { c.style.display = hiddenPrev[i]; });
      scheduleEl.style.removeProperty('width');

      document.body.classList.remove('pdf-export-mode');
      if (prevTheme) document.documentElement.setAttribute('data-theme', prevTheme);
      else document.documentElement.removeAttribute('data-theme');

      const blob = pdf.output('blob');
      const day = getActiveDay();
      const safeTitle = (state.prodTitle || 'קולשיט').replace(/[^\u0590-\u05FFa-zA-Z0-9]+/g, '_') || 'קולשיט';
      const safeDay = (day.label || 'יום').replace(/[^\u0590-\u05FFa-zA-Z0-9]+/g, '_');
      await saveFile({ filename: 'קולשיט_' + safeTitle + '_' + safeDay + '.pdf', data: blob });
      statusEl.textContent = 'PDF נשמר';
    } catch (e) {
      document.body.classList.remove('pdf-export-mode');
      if (e && e.code === 'declined') { statusEl.textContent = 'בוטל'; return; }
      console.error('pdf export failed', e);
      await showAlert('שגיאה בייצוא PDF. אפשר תמיד להשתמש בכפתור ההדפסה ולבחור "שמירה כ-PDF".');
      statusEl.textContent = 'שגיאה';
    }
  }

  /* ---------- Word export: build a real .docx with the active day's data (text only, no photos) ---------- */
  async function exportWord() {
    const statusEl = document.getElementById('saveStatus');
    try {
      statusEl.textContent = 'מכין Word…';

      await loadScriptOnce('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js', () => window.docx);
      const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, AlignmentType, BorderStyle, PageOrientation } = window.docx;

      const day = getActiveDay();
      const times = computeScheduleTimes(day);

      function p(text, opts) {
        opts = opts || {};
        return new Paragraph({
          alignment: AlignmentType.RIGHT,
          bidirectional: true,
          heading: opts.heading,
          spacing: opts.spacing || { after: 100 },
          pageBreakBefore: !!opts.pageBreakBefore,
          children: [ new TextRun({ text: text || '', bold: !!opts.bold, size: opts.size || 22 }) ]
        });
      }
      function cell(text, opts) {
        opts = opts || {};
        return new TableCell({
          width: { size: opts.width || 10, type: WidthType.PERCENTAGE },
          columnSpan: opts.colSpan,
          shading: opts.shade ? { fill: opts.shade } : undefined,
          children: [ new Paragraph({
            alignment: AlignmentType.RIGHT,
            bidirectional: true,
            children: [ new TextRun({ text: text || '', bold: !!opts.bold, size: opts.size || 18 }) ]
          }) ]
        });
      }
      function row(cells) {
        // The columns above are built right-to-left (first = rightmost, matching
        // how the schedule reads on screen). Word lays out table columns left-to-right,
        // so reversing here is what actually puts them in the correct RTL order.
        return new TableRow({ children: cells.slice().reverse() });
      }
      const thinBorders = {
        top: { style: BorderStyle.SINGLE, size: 2, color: 'CCCCCC' },
        bottom: { style: BorderStyle.SINGLE, size: 2, color: 'CCCCCC' },
        left: { style: BorderStyle.SINGLE, size: 2, color: 'CCCCCC' },
        right: { style: BorderStyle.SINGLE, size: 2, color: 'CCCCCC' },
        insideHorizontal: { style: BorderStyle.SINGLE, size: 2, color: 'CCCCCC' },
        insideVertical: { style: BorderStyle.SINGLE, size: 2, color: 'CCCCCC' }
      };

      const children = [];
      children.push(p(state.prodTitle || 'שם ההפקה', { heading: HeadingLevel.TITLE, bold: true, size: 40 }));
      if (state.prodCompany) children.push(p(state.prodCompany, { size: 20 }));
      children.push(p((day.label || 'יום') + ' מתוך ' + (day.totalDays || '?') + '   ·   תאריך: ' + (day.date || '—'), { bold: true, size: 24 }));

      const creditsLine = state.credits.filter(c => c.role || c.name).map(c => (c.role || '') + ': ' + (c.name || '—')).join('   |   ');
      if (creditsLine) children.push(p(creditsLine, { size: 18 }));

      children.push(p('קריאה כללית: ' + (day.generalCall || '—') + '   |   שקיעה: ' + (day.sunset || '—') + '   |   זריחה: ' + (day.sunrise || '—') + '   |   סצנות (סה"כ ליום): ' + (day.scenesCount || '—'), { size: 18 }));
      children.push(p('לוקיישן ראשי: ' + (day.mainLocation || '—') + '   |   חניה: ' + (day.parking || '—'), { size: 18 }));
      if (day.hospital) children.push(p('בית חולים קרוב: ' + day.hospital, { size: 18 }));

      // Credits, day info, locations and cast all belong on the cover page;
      // the shooting-schedule table starts fresh on the page(s) after it.
      children.push(p('שחקנים — קריאה אישית', { heading: HeadingLevel.HEADING_1, bold: true, size: 28, spacing: { before: 300, after: 150 } }));
      const castHeader = row(['#','שם','תפקיד','קריאה','איסוף'].map(t => cell(t, { bold: true, shade: 'EEEEEE', width: 20 })));
      const castRows = (day.cast || []).map(c => row([cell(c.num||''), cell(c.name||''), cell(c.role||''), cell(c.call||''), cell(c.pickup||'')]));
      children.push(new Table({ rows: [castHeader, ...castRows], width: { size: 100, type: WidthType.PERCENTAGE }, borders: thinBorders }));

      children.push(p('לוח צילומים', { heading: HeadingLevel.HEADING_1, bold: true, size: 28, spacing: { before: 300, after: 150 }, pageBreakBefore: true }));

      const headerCells = ['דקות','שעה','סצנה','עמודים','פ/ח','יום/לילה','לוקיישן','תאור הסצנה','שחקנים','ניצבים','ארט','הלבשה','הערות']
        .map(t => cell(t, { bold: true, shade: 'EEEEEE', width: 8 }));
      const tableRows = [ row(headerCells) ];

      day.schedule.forEach((item, idx) => {
        if (item.type === 'break') {
          tableRows.push(row([
            cell(item.minutes || '', { width: 8 }),
            cell(formatComputedRange(times[idx]), { width: 16 }),
            cell(item.label || '', { colSpan: 11, bold: true, shade: 'F6D9D5' })
          ]));
        } else {
          const actorsTxt = (item.actorsList || []).map((a, i) => (i + 1) + '. ' + (a.name || '')).join(', ');
          const extrasTxt = (item.extrasList || []).map((x, i) => (i + 1) + '. ' + (x.name || '')).join(', ');
          tableRows.push(row([
            cell(item.minutes || ''),
            cell(formatComputedRange(times[idx])),
            cell(item.sceneNum || ''),
            cell(item.pages || ''),
            cell(item.io || ''),
            cell(item.dayNight || ''),
            cell(item.location || ''),
            cell(item.desc || ''),
            cell(actorsTxt),
            cell(extrasTxt),
            cell(item.art || ''),
            cell(actorsTxt),
            cell(item.notes || '')
          ]));
        }
      });
      children.push(new Table({ rows: tableRows, width: { size: 100, type: WidthType.PERCENTAGE }, borders: thinBorders }));

      if (day.notes) {
        children.push(p('הערות כלליות', { heading: HeadingLevel.HEADING_1, bold: true, size: 28, spacing: { before: 300, after: 150 } }));
        children.push(p(day.notes, { size: 20 }));
      }

      const doc = new Document({
        sections: [{
          properties: {
            page: {
              size: { orientation: PageOrientation.LANDSCAPE, width: 16838, height: 11906 }, // A4, twips
              margin: { top: 850, right: 850, bottom: 850, left: 850 } // ~1.5cm on every side
            }
          },
          children
        }]
      });
      const blob = await Packer.toBlob(doc);
      const safeTitle = (state.prodTitle || 'קולשיט').replace(/[^\u0590-\u05FFa-zA-Z0-9]+/g, '_') || 'קולשיט';
      const safeDay = (day.label || 'יום').replace(/[^\u0590-\u05FFa-zA-Z0-9]+/g, '_');
      await saveFile({ filename: 'קולשיט_' + safeTitle + '_' + safeDay + '.docx', data: blob });
      statusEl.textContent = 'Word נשמר';
    } catch (e) {
      if (e && e.code === 'declined') { statusEl.textContent = 'בוטל'; return; }
      console.error('word export failed', e);
      await showAlert('שגיאה בייצוא Word.');
      statusEl.textContent = 'שגיאה';
    }
  }

  async function handleImportFile(file) {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const importedState = parsed && parsed.state ? parsed.state : parsed; // tolerate a raw state.json too
      if (!importedState || !Array.isArray(importedState.days)) {
        await showAlert('קובץ הגיבוי לא תקין או לא בפורמט הנכון.');
        return;
      }
      const ok = await showConfirm('טעינת הגיבוי תחליף את כל הנתונים הנוכחיים במערכת (כולל כל הימים). להמשיך?');
      if (!ok) return;

      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, importedState);
      if (!state.days || !state.days.length) state.days = [blankDay(1)];
      if (!state.credits || !state.credits.length) state.credits = defaultRoles.map(blankCredit);
      state.days.forEach(d => { if (d.schedule) d.schedule.forEach(migrateSceneItem); });
      if (!state.activeDayId || !state.days.find(d => d.id === state.activeDayId)) state.activeDayId = state.days[0].id;

      if (parsed && parsed.photos) {
        for (const [k, dataUrl] of Object.entries(parsed.photos)) {
          await savePhoto(k, dataUrl);
        }
      }

      bindTop(); renderCredits(); renderTabs(); renderPanels(); save();
      await showAlert('הגיבוי נטען בהצלחה.');
    } catch (e) {
      console.error('import failed', e);
      await showAlert('שגיאה בטעינת קובץ הגיבוי. ודאי שזה קובץ JSON שיוצא מהמערכת הזו.');
    }
  }

  /* ---------- toolbar ---------- */
  // The browser's native print/"Save as PDF" shrinks the wide schedule table
  // to fit one page width, producing tiny, hard-to-read text and no clean
  // break before the schedule. The PDF export below already solves both
  // (natural size, paginated, cover page separated from the schedule), so
  // the print button reuses it instead of window.print().
  document.getElementById('printBtn').addEventListener('click', exportPDF);
  document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);
  document.getElementById('exportWordBtn').addEventListener('click', exportWord);
  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFileInput').click());
  document.getElementById('importFileInput').addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (file) handleImportFile(file);
    ev.target.value = '';
  });

  async function init() {
    initEditGate();
    loadLocal();
    bindTop();
    renderCredits();
    renderTabs();
    renderPanels();
    const syncBadgeEl = document.getElementById('syncBadge');
    if (syncBadgeEl) { syncBadgeEl.style.cursor = 'pointer'; syncBadgeEl.addEventListener('click', retryDbConnection); }
    await initDb(); // may pull in shared data from other collaborators — re-render if so
    bindTop();
    renderCredits();
    renderTabs();
    renderPanels();
  }
  init();
})();
</script>

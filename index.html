<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קולשיט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #17191d;
    --paper-raised: #1e2126;
    --paper-sunk: #121417;
    --ink: #eceae4;
    --ink-dim: #9a9d9c;
    --line: #33363b;
    --accent: #f2c230;
    --accent-ink: #1a1400;
    --danger: #e3583f;
    --ext: #e8a33d;
    --ext-ink: #1a1200;
    --int: #d4574a;
    --int-ink: #2a0a06;
    --break-bg: #4a2426;
    --break-ink: #f3c9c4;
    --radius: 3px;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Heebo', system-ui, sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --paper: #f3f1ea; --paper-raised: #ffffff; --paper-sunk: #ece9e0;
      --ink: #1a1a17; --ink-dim: #6b6b63; --line: #d8d4c8; --accent-ink: #1a1400;
      --break-bg: #f6d9d5; --break-ink: #7a231a;
    }
  }
  :root[data-theme="light"] {
    --paper: #f3f1ea; --paper-raised: #ffffff; --paper-sunk: #ece9e0;
    --ink: #1a1a17; --ink-dim: #6b6b63; --line: #d8d4c8; --accent-ink: #1a1400;
    --break-bg: #f6d9d5; --break-ink: #7a231a;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); padding: 28px 16px 130px; min-height: 100vh; }
  /* every card (credits, cast, day info, schedule...) lives inside .wrap, so
     widening it here widens all of them together, at the same width */
  .wrap { max-width: min(94vw, 1760px); margin: 0 auto; }

  /* the schedule table used to break out of .wrap on its own; now .wrap
     itself is wide enough for every card (see .wrap above), so the schedule
     card just needs to fill it like any other card — no separate rule needed */

  .hazard {
    height: 8px;
    background: repeating-linear-gradient(-45deg, var(--accent), var(--accent) 14px, var(--paper) 14px, var(--paper) 28px);
    border-radius: 2px; margin-bottom: 18px; opacity: .9;
  }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .slate { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--ink-dim); }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(26px, 4.5vw, 38px); font-weight: 900; margin: 2px 0 0; letter-spacing: -0.01em; }
  input.title-input {
    font-size: clamp(22px, 4vw, 32px); font-weight: 900; background: transparent; border: none;
    border-bottom: 2px solid var(--line); color: var(--ink); font-family: var(--sans); padding: 2px 2px 6px; min-width: 240px;
  }
  input.title-input:focus { outline: none; border-bottom-color: var(--accent); }
  input.company-input {
    font-family: var(--mono); font-size: 12px; background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: var(--ink-dim); padding: 2px; width: 200px;
  }
  input.company-input:focus { outline: none; border-bottom-color: var(--accent); }

  .sync-badge { font-family: var(--mono); font-size: 11.5px; padding: 6px 12px; border-radius: 20px; white-space: nowrap; align-self: flex-start; }
  .sync-badge.sync-shared { background: rgba(88,166,255,0.15); color: #6cb4ff; border: 1px solid rgba(108,180,255,0.4); }
  .sync-badge.sync-local { background: rgba(242,194,48,0.12); color: var(--accent); border: 1px solid rgba(242,194,48,0.35); }

  section.card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 18px 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; font-weight: 700; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card h2 .hint { font-weight: 400; color: var(--ink-dim); font-size: 12px; }

  label { display: block; font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px; }
  input, textarea, select { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line); color: var(--ink); font-family: var(--sans); font-size: 14.5px; padding: 6px 2px 8px; border-radius: 0; transition: border-color .15s; }
  input:focus, textarea:focus, select:focus { outline: none; border-bottom-color: var(--accent); }
  .mono-field, input[type="time"] { font-family: var(--mono); }
  textarea { resize: vertical; min-height: 44px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 4px; }
  @media (max-width: 640px) { .grid2, .grid3, .grid4 { grid-template-columns: 1fr 1fr; } }

  /* ---- credits chips ---- */
  .credits-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .credit-chip { display: flex; align-items: center; gap: 6px; background: var(--paper-sunk); border: 1px solid var(--line); border-radius: 20px; padding: 4px 6px 4px 6px; }
  .credit-chip input { border: none; background: transparent; padding: 3px 6px; font-size: 13px; }
  .credit-chip input.role { color: var(--ink-dim); font-weight: 600; min-width: 60px; text-align: left; border-left: 1px solid var(--line); }
  .credit-chip input.name { min-width: 70px; }
  .credit-chip button { background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 13px; padding: 0 4px; }
  .credit-chip button:hover { color: var(--danger); }
  .add-chip { border: 1px dashed var(--line); background: none; color: var(--ink-dim); border-radius: 20px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: var(--sans); }
  .add-chip:hover { border-color: var(--accent); color: var(--ink); }

  /* ---- day tabs ---- */
  .day-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .day-tab { position: relative; }
  .day-tab button.tab-btn {
    font-family: var(--mono); font-size: 13px; font-weight: 600; background: var(--paper-raised);
    border: 1px solid var(--line); color: var(--ink-dim); padding: 9px 16px 9px 30px; border-radius: 8px; cursor: pointer;
  }
  .day-tab button.tab-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .day-tab .tab-close { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: inherit; opacity: .55; cursor: pointer; font-size: 13px; padding: 2px; }
  .day-tab .tab-close:hover { opacity: 1; }
  .day-tab-add { font-family: var(--sans); font-size: 13px; background: none; border: 1px dashed var(--line); color: var(--ink-dim); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  .day-tab-add:hover { border-color: var(--accent); color: var(--ink); }
  .day-panel { display: none; }
  .day-panel.active { display: block; }

  .day-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-small { font-family: var(--sans); font-size: 12.5px; background: var(--paper-sunk); border: 1px solid var(--line); color: var(--ink-dim); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  .btn-small:hover { color: var(--ink); border-color: var(--accent); }

  .day-badge { font-family: var(--mono); background: var(--accent); color: var(--accent-ink); padding: 6px 14px; border-radius: var(--radius); font-weight: 600; font-size: 13px; white-space: nowrap; }

  /* ---- simple repeatable rows (cast/crew) ---- */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; gap: 10px; align-items: end; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: none; padding-bottom: 0; }
  .row.crew { grid-template-columns: 100px 1.4fr 1fr 1fr 34px; }
  .row.cast { grid-template-columns: 40px 1.4fr 1fr 100px 1fr 34px; }
  @media (max-width: 720px) { .row.crew, .row.cast { grid-template-columns: 1fr 1fr; } }

  .icon-btn { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); width: 30px; height: 30px; border-radius: var(--radius); cursor: pointer; font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center; align-self: end; transition: border-color .15s, color .15s; flex-shrink: 0; }
  .icon-btn:hover { border-color: var(--danger); color: var(--danger); }
  .icon-btn.move:hover { border-color: var(--accent); color: var(--ink); }

  .add-row { margin-top: 12px; background: none; border: 1px dashed var(--line); color: var(--ink-dim); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-family: var(--sans); font-size: 13px; transition: border-color .15s, color .15s; }
  .add-row:hover { border-color: var(--accent); color: var(--ink); }
  .add-row-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .add-row-group .add-row { margin-top: 0; flex: 1; min-width: 160px; }

  /* ---- schedule table ---- */
  /* the table itself is capped and centered — it spreads out to fill the wide
     schedule-section on a normal screen, but stops growing past a sensible
     width on a huge monitor instead of stretching thin and looking sloppy */
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; max-width: 1760px; margin: 0 auto; }
  /* fixed table-layout keeps every column's PROPORTION locked (long text wraps
     onto more lines instead of the column stretching sideways to fit it) —
     width:100% then lets the browser scale every column up together to fill
     the table-scroll wrapper above, up to its capped width.
     (pdf-export-mode overrides this back to a fixed natural width below, so
     the exported PDF's column sizing is unaffected.) */
  table.schedule { border-collapse: collapse; table-layout: fixed; width: 100%; font-size: 13px; border: 1px solid var(--line); }
  /* full grid borders on-screen (not just a bottom line) — a proper boxed
     table, closer to how it looks in the exported PDF, instead of loose rows */
  table.schedule th { font-size: 11px; color: var(--ink-dim); font-weight: 700; text-align: center; padding: 8px 6px; border: 1px solid var(--line); background: var(--paper-sunk); white-space: nowrap; position: sticky; top: 0; }
  table.schedule td { padding: 4px; border: 1px solid var(--line); vertical-align: top; }
  table.schedule tr.scene-row:hover td { background: rgba(242,194,48,0.04); }
  table.schedule td input, table.schedule td textarea, table.schedule td select { border: 1px solid transparent; border-radius: 4px; padding: 6px 6px; font-size: 13px; background: var(--paper-sunk); overflow-wrap: break-word; word-break: break-word; }
  table.schedule td input:focus, table.schedule td textarea:focus, table.schedule td select:focus { border-color: var(--accent); }
  table.schedule td textarea { min-height: 34px; resize: vertical; }
  .col-minutes { width: 48px; }
  .col-time { width: 82px; }
  .col-scene { width: 52px; }
  .col-io { width: 46px; }
  .col-loc { width: 96px; }
  .col-desc { width: 210px; }
  .col-art { width: 84px; }
  .col-actors { width: 130px; }
  .col-wardrobe { width: 150px; }
  .col-notes { width: 130px; }
  .col-actions { width: 46px; text-align: center; }
  /* table-layout:fixed needs a hard wrap rule on every cell, or a long
     unbroken word (rather than typed text with spaces) could still force the
     column wider than its declared width */
  table.schedule td, table.schedule th { overflow-wrap: break-word; word-break: break-word; }

  select.io-select { text-align: center; font-weight: 700; cursor: pointer; }
  select.io-select.io-ext { background: var(--ext); color: var(--ext-ink); border-color: var(--ext); }
  select.io-select.io-int { background: var(--int); color: var(--int-ink); border-color: var(--int); }
  select.dn-select { text-align: center; font-weight: 700; cursor: pointer; }
  select.dn-select.dn-day { background: #f2c230; color: #1a1400; border-color: #f2c230; }
  select.dn-select.dn-night { background: #2a3b6e; color: #e8ecf9; border-color: #2a3b6e; }

  input.minutes-input { text-align: center; font-family: var(--mono); background: var(--paper-sunk); }

  /* ---- actors cell (numbered chips) ---- */
  .actors-cell { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
  .actor-chip { display: flex; align-items: center; gap: 4px; }
  .actor-num { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--mono); }
  .actor-name-input { flex: 1; min-width: 0; padding: 5px 6px; font-size: 12.5px; }
  .actor-rm { flex-shrink: 0; background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 11px; padding: 2px 3px; }
  .actor-rm:hover { color: var(--danger); }
  .actor-add { margin-top: 2px; background: none; border: 1px dashed var(--line); color: var(--ink-dim); border-radius: 4px; padding: 5px 8px; font-size: 11.5px; cursor: pointer; font-family: var(--sans); }
  .actor-add:hover { border-color: var(--accent); color: var(--ink); }

  /* ---- wardrobe cell (synced numbered photo boxes) ---- */
  .wardrobe-cell { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .wardrobe-hint { color: var(--ink-dim); font-size: 11.5px; padding: 6px 2px; }
  .wardrobe-box { flex-shrink: 0; }
  .wardrobe-thumb { position: relative; flex-shrink: 0; width: 76px; height: 76px; border-radius: 7px; border: 1px dashed var(--line); background: var(--paper-sunk); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .wardrobe-thumb:hover { border-color: var(--accent); }
  .wardrobe-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .wardrobe-placeholder { font-size: 22px; opacity: .5; }
  .wardrobe-num { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--mono); }

  tr.break-row td { background: var(--break-bg); padding: 8px; }
  tr.break-row .break-inner { display: flex; align-items: center; gap: 10px; }
  tr.break-row input.break-label { flex: 1; background: transparent; border: none; color: var(--break-ink); font-weight: 700; text-align: center; font-size: 13.5px; }
  tr.break-row .break-time { width: 110px; display: inline-block; color: var(--break-ink); font-family: var(--mono); text-align: center; font-weight: 600; }
  .computed-time { font-family: var(--mono); text-align: center; padding: 6px 4px; color: var(--ink-dim); background: var(--paper-sunk); border-radius: 4px; border: 1px dashed var(--line); font-size: 13px; }
  tr.break-row input.break-minutes { width: 50px; background: transparent; border: none; color: var(--break-ink); font-family: var(--mono); text-align: center; }

  .row-actions-cell { display: flex; gap: 3px; justify-content: center; }
  .row-actions-cell button { width: 24px; height: 24px; font-size: 12px; padding: 0; }

  footer.credit { text-align: center; color: var(--ink-dim); font-size: 11px; margin-top: 30px; font-family: var(--mono); }

  .toolbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.35); z-index: 50; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 20px); }
  .toolbar button { font-family: var(--sans); font-size: 13px; font-weight: 500; border: none; border-radius: 7px; padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line) !important; }
  .save-status { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); align-self: center; padding: 0 6px; white-space: nowrap; }

  /* ---- capture mode for client-generated PDF export (mirrors @media print hiding) ---- */
  body.pdf-export-mode .toolbar,
  body.pdf-export-mode .day-tabs,
  body.pdf-export-mode .day-actions,
  body.pdf-export-mode .add-row,
  body.pdf-export-mode .add-row-group,
  body.pdf-export-mode .credit-chip button,
  body.pdf-export-mode .add-chip,
  body.pdf-export-mode .col-actions,
  body.pdf-export-mode .row-actions-cell,
  body.pdf-export-mode .icon-btn,
  body.pdf-export-mode .actor-rm,
  body.pdf-export-mode .actor-add,
  body.pdf-export-mode .wardrobe-thumb { display: none !important; }
  body.pdf-export-mode .sync-badge { display: none !important; }
  body.pdf-export-mode .view-badge { display: none !important; }
  body.pdf-export-mode footer.credit { display: none !important; }
  body.pdf-export-mode .modal-overlay { display: none !important; }
  body.pdf-export-mode input,
  body.pdf-export-mode textarea,
  body.pdf-export-mode select:not(.io-select):not(.dn-select) { border: 1px solid #000 !important; background: transparent !important; color: #000 !important; }
  body.pdf-export-mode section.card { border: 1.5px solid #000 !important; background: #fff; }
  body.pdf-export-mode .wardrobe-box img { max-width: 60px; max-height: 60px; border-radius: 5px; }
  /* the default gray tones (labels, hints, dashed borders) read as too faint
     once actually printed/exported to PDF — darken everything to solid black
     for export/print specifically, without touching the on-screen theme */
  body.pdf-export-mode, body.pdf-export-mode h2, body.pdf-export-mode label,
  body.pdf-export-mode .card h2 .hint, body.pdf-export-mode .day-slate,
  body.pdf-export-mode .slate, body.pdf-export-mode .computed-time,
  body.pdf-export-mode table.schedule th, body.pdf-export-mode footer.credit {
    color: #000 !important;
  }
  body.pdf-export-mode .card h2 { border-bottom: 1px solid #000 !important; }
  body.pdf-export-mode .credit-chip { border: 1px solid #000 !important; }
  body.pdf-export-mode .credit-chip input.role { border-left: 1px solid #000 !important; }
  body.pdf-export-mode .computed-time { border: 1px dashed #000 !important; }
  body.pdf-export-mode .day-badge { border: 1px solid #000 !important; }
  body.pdf-export-mode table.schedule th { border: 1.5px solid #000 !important; background: #eee !important; position: static !important; top: auto !important; }
  body.pdf-export-mode table.schedule td { border: 1px solid #000 !important; }
  body.pdf-export-mode table.schedule { border: 1.5px solid #000 !important; }
  body.pdf-export-mode .table-scroll { border: 1.5px solid #000 !important; }
  body.pdf-export-mode .rows .row { border-bottom: 1px dashed #000 !important; }
  /* the schedule table is wider than the normal page and normally scrolls
     horizontally — for export, let it fully expand instead of being clipped */
  body.pdf-export-mode { overflow-x: visible !important; }
  body.pdf-export-mode .wrap { max-width: none !important; width: max-content !important; }
  body.pdf-export-mode .table-scroll { overflow: visible !important; max-width: none !important; margin: 0 !important; }
  body.pdf-export-mode table.schedule { width: max-content !important; }
  /* the schedule table is captured as its own separate image during export
     (see exportPDF), so its on-screen full-bleed breakout is turned off here
     — it would otherwise size itself against the live browser window instead
     of its own natural content width */
  body.pdf-export-mode .schedule-section { width: auto !important; max-width: none !important; margin-left: 0 !important; margin-right: 0 !important; padding-left: 18px !important; padding-right: 18px !important; }

  @media print {
    body { background: white; color: black; padding: 0; }
    @page { size: landscape; margin: 9mm; }
    .toolbar, .day-tabs, .day-actions, .add-row, .add-row-group, .credit-chip button, .add-chip { display: none !important; }
    .sync-badge { display: none !important; }
    .modal-overlay { display: none !important; }
    section.card { border: 1px solid #999; break-inside: avoid; background: white; margin-bottom: 10px; }
    .day-panel { display: none !important; }
    .day-panel.active { display: block !important; }
    input, textarea, select { border-bottom: 1px solid #ccc; color: black; background: transparent !important; }
    table.schedule td input, table.schedule td textarea, table.schedule td select { border: 1px solid #ccc; }
    .day-badge { background: #eee; color: #000; border: 1px solid #333; }
    .hazard { background: repeating-linear-gradient(-45deg, #000, #000 10px, white 10px, white 20px); }
    .col-actions, .row-actions-cell, .icon-btn { display: none !important; }
    .actor-rm, .actor-add { display: none !important; }
    .wardrobe-thumb { cursor: default; border-style: solid; border-color: #ccc; }
    .wardrobe-box img { max-width: 60px; max-height: 60px; border-radius: 5px; }
    .wardrobe-num { background: var(--accent) !important; color: var(--accent-ink) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .schedule-section { break-before: page; page-break-before: always; }
    table.schedule th { background: #eee; color: #000; position: static; top: auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    select.io-select.io-ext { background: var(--ext) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    select.io-select.io-int { background: var(--int) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    select.dn-select.dn-day { background: #f2c230 !important; color: #1a1400 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    select.dn-select.dn-night { background: #2a3b6e !important; color: #e8ecf9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr.break-row td { background: #f3d8d5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .actor-num { background: var(--accent) !important; color: var(--accent-ink) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .credit-chip { border: 1px solid #ccc; }
  }

  /* ---- in-page dialog (replaces native confirm()/alert(), which the artifact's
     sandboxed frame silently blocks — those calls returned undefined and any
     "if (!confirm(...)) return;" bailed out with no visible sign anything happened) ---- */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .modal-message { margin: 0 0 18px; font-size: 14.5px; line-height: 1.5; color: var(--ink); white-space: pre-line; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-btn { font-family: var(--sans); font-size: 13.5px; font-weight: 500; border: none; border-radius: 7px; padding: 10px 18px; cursor: pointer; }
  .modal-btn-ok { background: var(--accent); color: var(--accent-ink); }
  .modal-btn-cancel { background: transparent; color: var(--ink); border: 1px solid var(--line); }

  /* ---- editor login: everyone with the link can view; entering the editor
     code unlocks editing. No gate blocks viewing at all. ---- */
  .edit-login-overlay {
    display: none; position: fixed; inset: 0; z-index: 500; align-items: center;
    justify-content: center; padding: 20px; background: rgba(0,0,0,.5);
  }
  .edit-login-overlay.open { display: flex; }
  .access-gate-box {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 32px 28px; max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .access-gate-box h1 { font-size: 17px; margin: 0 0 6px; color: var(--ink); }
  .access-gate-box p { font-size: 13px; color: var(--ink-dim); margin: 0 0 20px; }
  .access-gate-box input {
    width: 100%; box-sizing: border-box; font-family: var(--mono); font-size: 20px;
    text-align: center; letter-spacing: 3px; padding: 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper-sunk); color: var(--ink);
    margin-bottom: 12px;
  }
  .access-gate-box button {
    width: 100%; font-family: var(--sans); font-size: 14px; font-weight: 600;
    padding: 11px; border: none; border-radius: 8px; background: var(--accent);
    color: var(--accent-ink); cursor: pointer;
  }
  .access-gate-error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .access-gate-cancel {
    margin-top: 8px; background: none !important; border: none; color: var(--ink-dim) !important;
    font-size: 12px !important; font-weight: 400 !important; text-decoration: underline; cursor: pointer;
  }
  .view-badge {
    font-family: var(--sans); font-size: 12px; color: var(--ink-dim);
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 20px;
    padding: 5px 12px; cursor: pointer; white-space: nowrap;
  }

  /* view-only mode (the default for everyone until the editor code is entered):
     freeze every field, hide anything that adds/removes/imports/resets */
  body.view-only-mode .wrap input,
  body.view-only-mode .wrap textarea,
  body.view-only-mode .wrap select { pointer-events: none; background: var(--paper-sunk) !important; }
  /* ...but the day/night and int/ext badges carry meaning through color —
     keep their yellow/navy/orange/green look in view-only mode instead of
     falling back to plain gray like an ordinary disabled field */
  body.view-only-mode .wrap select.io-select,
  body.view-only-mode .wrap select.dn-select { pointer-events: none; }
  body.view-only-mode .wrap select.io-select.io-ext { background: var(--ext) !important; color: var(--ext-ink) !important; }
  body.view-only-mode .wrap select.io-select.io-int { background: var(--int) !important; color: var(--int-ink) !important; }
  body.view-only-mode .wrap select.dn-select.dn-day { background: #f2c230 !important; color: #1a1400 !important; }
  body.view-only-mode .wrap select.dn-select.dn-night { background: #2a3b6e !important; color: #e8ecf9 !important; }
  body.view-only-mode .add-chip,
  body.view-only-mode .add-row,
  body.view-only-mode .add-row-group,
  body.view-only-mode .credit-chip button,
  body.view-only-mode .col-actions,
  body.view-only-mode .row-actions-cell,
  body.view-only-mode .icon-btn,
  body.view-only-mode .actor-rm,
  body.view-only-mode .actor-add,
  body.view-only-mode .wardrobe-thumb,
  body.view-only-mode .day-actions,
  body.view-only-mode #importBtn,
</style>
</head>
<body>

<div class="edit-login-overlay" id="editLoginOverlay">
  <form class="access-gate-box" id="accessGateForm">
    <h1>כניסה כעורך/ת</h1>
    <p>הקלידו את קוד העריכה כדי לפתוח את כל השדות לעריכה</p>
    <input id="accessGateInput" type="text" inputmode="numeric" autocomplete="off" placeholder="קוד עריכה" autofocus />
    <button type="submit">כניסה כעורך/ת</button>
    <button type="button" class="access-gate-cancel" id="accessGateCancel">ביטול</button>
    <div class="access-gate-error" id="accessGateError"></div>
  </form>
</div>

<div class="wrap">

  <div class="hazard"></div>
  <header class="top">
    <div>
      <div class="slate">CALL SHEET · MULTI-DAY</div>
      <div class="title-row">
        <input class="title-input" id="prodTitle" placeholder="שם ההפקה / הפרק" />
      </div>
      <input class="company-input" id="prodCompany" placeholder="חברת הפקה" style="margin-top:6px;" />
    </div>
    <span class="view-badge" id="viewBadge">👁️ מצב צפייה — לחצו כדי להיכנס כעורך/ת</span>
    <span class="sync-badge" id="syncBadge">🔄 בודק זמינות שיתוף…</span>
  </header>

  <!-- Credits -->
  <section class="card">
    <h2>אנשי מפתח <span class="hint">תפקיד ושם — יופיע בראש כל קולשיט</span></h2>
    <div class="credits-list" id="creditsList"></div>
    <button class="add-chip" id="addCredit" type="button">+ הוספת תפקיד</button>
  </section>

  <!-- Day tabs -->
  <div class="day-tabs" id="dayTabs"></div>

  <div id="dayPanels"></div>

  <input type="file" id="importFileInput" accept="application/json,.json" style="display:none">
  <footer class="credit">נשמר אוטומטית בדפדפן זה בלבד · הדפסה מייצאת את היום הפעיל בלבד</footer>
</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal-box">
    <p class="modal-message" id="modalMessage"></p>
    <div class="modal-actions" id="modalActions">
      <button class="modal-btn modal-btn-cancel" id="modalCancelBtn" type="button">ביטול</button>
      <button class="modal-btn modal-btn-ok" id="modalOkBtn" type="button">אישור</button>
    </div>
  </div>
</div>

<div class="toolbar">
  <button class="btn-primary" id="printBtn" type="button">🖨️ הדפסה (PDF מסודר)</button>
  <button class="btn-ghost" id="exportPdfBtn" type="button">📄 ייצוא PDF</button>
  <button class="btn-ghost" id="exportWordBtn" type="button">📝 ייצוא Word</button>
  <button class="btn-ghost" id="exportBtn" type="button">⬇️ הורדת גיבוי</button>
  <button class="btn-ghost" id="importBtn" type="button">⬆️ טעינת גיבוי</button>
  <span class="save-status" id="saveStatus">נשמר</span>
</div>

<script>
(function() {
  const STORAGE_KEY = 'callsheet:v2:draft';
  let uidCounter = 1;
  function uid() { return 'id' + (uidCounter++) + '_' + Math.random().toString(36).slice(2,7); }

  /* ---------- editor access code ----------
     Anyone who has the link can view, print and export — no code needed for
     that at all. Only switching into EDIT mode (unlocking every field, plus
     add/remove/import/reset) requires this code. Once entered, it's
     remembered in this browser (localStorage) so it isn't asked again here.
     To change the code later, just edit EDITOR_CODE below and republish. */
  const EDITOR_CODE = '56789';
  const EDIT_ROLE_KEY = 'callsheet:isEditor';

  function isEditor() {
    try { return localStorage.getItem(EDIT_ROLE_KEY) === '1'; } catch (e) { return false; }
  }
  function applyEditRoleUI() {
    const editing = isEditor();
    document.body.classList.toggle('view-only-mode', !editing);
    const badge = document.getElementById('viewBadge');
    if (badge) badge.textContent = editing ? '✏️ מצב עריכה — לחצו כדי לחזור לצפייה' : '👁️ מצב צפייה — לחצו כדי להיכנס כעורך/ת';
  }
  function openEditLogin() {
    document.getElementById('accessGateError').textContent = '';
    document.getElementById('accessGateInput').value = '';
    document.getElementById('editLoginOverlay').classList.add('open');
    document.getElementById('accessGateInput').focus();
  }
  function closeEditLogin() {
    document.getElementById('editLoginOverlay').classList.remove('open');
  }
  function initEditGate() {
    applyEditRoleUI();
    document.getElementById('viewBadge').addEventListener('click', () => {
      if (isEditor()) {
        try { localStorage.removeItem(EDIT_ROLE_KEY); } catch (e) {}
        applyEditRoleUI();
      } else {
        openEditLogin();
      }
    });
    document.getElementById('accessGateCancel').addEventListener('click', closeEditLogin);
    document.getElementById('editLoginOverlay').addEventListener('click', (ev) => {
      if (ev.target.id === 'editLoginOverlay') closeEditLogin();
    });
    document.getElementById('accessGateForm').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const code = document.getElementById('accessGateInput').value.trim();
      if (code === EDITOR_CODE) {
        try { localStorage.setItem(EDIT_ROLE_KEY, '1'); } catch (e) {}
        applyEditRoleUI();
        closeEditLogin();
      } else {
        document.getElementById('accessGateError').textContent = 'קוד שגוי, נסו שוב.';
        document.getElementById('accessGateInput').value = '';
        document.getElementById('accessGateInput').focus();
      }
    });
  }

  function blankCredit(role) { return { id: uid(), role: role || '', name: '' }; }
  function blankScene() { return { id: uid(), type: 'scene', time: '', sceneNum: '', pages: '', io: 'ח', dayNight: 'יום', location: '', desc: '', actorsList: [], extrasList: [], art: '', wardrobePhotos: {}, notes: '', minutes: '' }; }
  function blankBreak() { return { id: uid(), type: 'break', time: '', label: '', minutes: '' }; }
  function blankCast() { return { id: uid(), num: '', name: '', role: '', call: '', pickup: '' }; }

  /* ---------- in-page dialog: replaces window.alert / window.confirm ----------
     The artifact runs in a sandboxed iframe where native dialogs are silently
     blocked (confirm() returns undefined/false with no dialog ever shown), so
     any code written as "if (!confirm(...)) return;" would quietly no-op —
     exactly the "the button does nothing" symptom. showAlert/showConfirm below
     render a real in-page dialog instead and resolve a Promise on the user's
     choice. */
  let modalResolver = null;
  function closeModal(result) {
    document.getElementById('modalOverlay').classList.remove('open');
    if (modalResolver) { const r = modalResolver; modalResolver = null; r(result); }
  }
  function showAlert(message) {
    return new Promise((resolve) => {
      modalResolver = () => resolve(undefined);
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('modalCancelBtn').style.display = 'none';
      document.getElementById('modalOkBtn').textContent = 'הבנתי';
      document.getElementById('modalOverlay').classList.add('open');
    });
  }
  function showConfirm(message) {
    return new Promise((resolve) => {
      modalResolver = resolve;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('modalCancelBtn').style.display = '';
      document.getElementById('modalOkBtn').textContent = 'אישור';
      document.getElementById('modalOverlay').classList.add('open');
    });
  }
  document.getElementById('modalOkBtn').addEventListener('click', () => closeModal(true));
  document.getElementById('modalCancelBtn').addEventListener('click', () => closeModal(false));
  document.getElementById('modalOverlay').addEventListener('click', (ev) => {
    if (ev.target.id === 'modalOverlay') closeModal(false);
  });

  /* ---------- Claude runtime capability + dynamic library loader ---------- */
  async function useCapability(name) {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return null;
      return await window.claude.use(name);
    } catch (e) { return null; }
  }
  // Claude's own "downloads" capability only exists inside claude.ai's artifact
  // viewer — on a real, independently-hosted page (e.g. GitHub Pages) there is
  // no window.claude at all, so useCapability('downloads') always returns
  // null there. This is the ordinary way every other website saves a file:
  // a plain <a download> link on a Blob URL, no special permission needed.
  function saveFileNatively({ filename, data }) {
    const url = URL.createObjectURL(data);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function saveFile({ filename, data }) {
    const downloads = await useCapability('downloads');
    if (downloads) { await downloads.save({ filename, data }); return; }
    saveFileNatively({ filename, data });
  }
  function loadScriptOnce(src, checkLoaded) {
    return new Promise((resolve, reject) => {
      if (checkLoaded()) { resolve(); return; }
      const existing = document.querySelector('script[data-src="' + src + '"]');
      if (existing) {
        existing.addEventListener('load', () => resolve());
        existing.addEventListener('error', () => reject(new Error('load failed: ' + src)));
        return;
      }
      const s = document.createElement('script');
      s.src = src;
      s.setAttribute('data-src', src);
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('load failed: ' + src));
      document.head.appendChild(s);
    });
  }

  /* ---------- photo storage (IndexedDB — photos can exceed localStorage's size limit) ---------- */
  const PHOTO_DB_NAME = 'callsheetPhotosDB';
  const PHOTO_STORE = 'photos';
  let photoDbPromise = null;
  function openPhotoDB() {
    if (photoDbPromise) return photoDbPromise;
    photoDbPromise = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open(PHOTO_DB_NAME, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(PHOTO_STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
    return photoDbPromise;
  }
  async function savePhoto(key, dataUrl) {
    const db = await openPhotoDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).put(dataUrl, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function getPhoto(key) {
    if (!key) return null;
    try {
      const db = await openPhotoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PHOTO_STORE, 'readonly');
        const req = tx.objectStore(PHOTO_STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch (e) { return null; }
  }
  async function deletePhoto(key) {
    const db = await openPhotoDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  /* ---------- time math for auto-calculated schedule ---------- */
  function parseTimeStr(str) {
    if (!str) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(str).trim());
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }
  function formatMinutesAsTime(total) {
    if (total == null || isNaN(total)) return '';
    // Clock times wrap at 24:00 — a schedule that runs past midnight should
    // show 00:15, 01:30 etc. (a new day on the clock), never 24:15, 25:30.
    const wrapped = ((total % 1440) + 1440) % 1440;
    const h = Math.floor(wrapped / 60);
    const m = wrapped % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }
  // Walks the schedule in order, starting from day.scheduleStart, and returns
  // an array of {start, end, durationMin} aligned with day.schedule indices.
  // Reordering rows automatically shifts every following time, since each
  // row's start is simply the previous row's end.
  function computeScheduleTimes(day) {
    let cursor = parseTimeStr(day.scheduleStart);
    return day.schedule.map(item => {
      if (cursor == null) return { start: null, end: null, durationMin: null };
      const dur = parseInt(item.minutes, 10);
      const validDur = isNaN(dur) ? 0 : dur;
      const start = cursor;
      const end = cursor + validDur;
      cursor = end;
      return { start, end, durationMin: isNaN(dur) ? null : validDur };
    });
  }
  function formatComputedRange(t) {
    if (!t || t.start == null) return '—';
    if (!t.durationMin) return formatMinutesAsTime(t.start);
    return formatMinutesAsTime(t.start) + '-' + formatMinutesAsTime(t.end);
  }
  // Total elapsed shooting time (start to end, including any breaks in
  // between) plus the day's end time — both derived from the same schedule
  // walk as the per-row times above, so they always stay in sync.
  function computeDayTotals(day) {
    const times = computeScheduleTimes(day);
    let endTime = null;
    for (let i = times.length - 1; i >= 0; i--) {
      if (times[i] && times[i].end != null) { endTime = times[i].end; break; }
    }
    const startTime = parseTimeStr(day.scheduleStart);
    const totalMin = (startTime != null && endTime != null) ? (endTime - startTime) : null;
    return { endTime, totalMin };
  }
  function formatDurationHM(totalMin) {
    if (totalMin == null || isNaN(totalMin)) return '—';
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h + ':' + String(m).padStart(2, '0') + ' שעות';
  }
  // The day-meta "סצנות" summary is derived straight from the "סצנה מס'"
  // column of the schedule below, in order, rather than typed separately —
  // scene numbers are free text (e.g. "5-8" for a range), not plain
  // integers, so this just lists what's actually entered instead of doing
  // arithmetic on it.
  function computeScenesSummary(day) {
    const nums = (day.schedule || [])
      .filter(item => item.type !== 'break' && item.sceneNum && item.sceneNum.trim())
      .map(item => item.sceneNum.trim());
    return nums.length ? nums.join(', ') : '—';
  }

  function blankDay(n) {
    return {
      id: uid(), label: 'יום ' + n, dayNum: String(n), totalDays: '4', date: '',
      generalCall: '', sunrise: '', sunset: '',
      mainLocation: '', parking: '', hospital: '', scenesCount: '', scheduleStart: '',
      schedule: [ blankScene() ],
      cast: [ blankCast() ],
      notes: ''
    };
  }

  const defaultRoles = ['בימוי','הפקה בפועל','צלם/ת','צלם/ת 2','תאורה','ארט והלבשה','נערת/עורך תסריט','סאונד','איפור'];

  // Baked-in default: the production's real, current call sheet data. This is
  // what anyone opening the link sees immediately, from any device or Claude
  // account — it does NOT depend on the shared-database capability (which
  // only syncs between browsers on the SAME Claude account/organization, not
  // across arbitrary accounts). loadLocal()/initDb() below will still

      el2.textContent = '🔄 מתחבר לשיתוף…';
      el2.className = 'sync-badge sync-local';
      el2.title = '';
    } else {
      el2.textContent = '💻 מצב מקומי בלבד — נשמר רק בדפדפן הזה, לא משותף (לחצו כדי לנסות שוב)';
      el2.className = 'sync-badge sync-local';
      el2.title = 'לחצו כדי לנסות להתחבר שוב לשיתוף';
    }
  }

  let dbRetryCount = 0;
  let dbAttemptToken = 0; // bumped on every new attempt so a stale timed-out attempt can't act after a newer one already finished
  const DB_MAX_RETRIES = 4; // a slow network or a cold CDN cache shouldn't strand the page in local-only mode after one bad attempt
  const DB_RETRY_DELAYS_MS = [1500, 3000, 6000, 12000];
  const DB_ATTEMPT_TIMEOUT_MS = 9000; // if the network call itself just hangs (never resolves, never rejects), don't wait forever — treat it as a failed attempt so retry/fallback can still kick in

  function withTimeout(promise, ms) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('timed out')), ms);
      promise.then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
    });
  }

  async function attemptDbConnect() {
    // Google's own gstatic.com CDN build ships "firebase-app.js" and
    // "firebase-firestore.js" as a matched pair, pinned to the exact same
    // internal @firebase/app version — that's what makes getFirestore() able
    // to find the app that initializeApp() just registered. jsdelivr's "+esm"
    // endpoint (tried first) independently resolved slightly different
    // @firebase/app sub-versions for the app vs. firestore packages, so the
    // two never saw the same registry and every connection attempt failed
    // with "Service firestore is not available" — a real bug, not a network
    // or CSP issue, confirmed via the browser console. (Note: gstatic.com is
    // blocked by a Claude Artifact's security policy, so this only works once
    // the page is hosted on its own real domain outside of Claude, as it now
    // is.)
    const [{ initializeApp }, { getFirestore, doc, getDoc, setDoc, onSnapshot }] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')
    ]);
    const fbApp = initializeApp(FIREBASE_CONFIG);
    const fsDb = getFirestore(fbApp);
    const stateDocRef = doc(fsDb, 'callsheet', 'state');
    fsSetDoc = (data) => setDoc(stateDocRef, data);

    const snap = await getDoc(stateDocRef);
    if (snap.exists() && snap.data()) {
      applyIncomingState(snap.data());
      lastSyncedRev = state.__rev || 0;
    } else {
      state.__rev = 0;
      await setDoc(stateDocRef, JSON.parse(JSON.stringify(state)));
      lastSyncedRev = 0;
    }
    dbRetryCount = 0;
    dbAvailable = true;
    setSyncBadge('shared');
    onSnapshot(stateDocRef, (snap2) => {
      if (!snap2.exists()) return;
      const data = snap2.data();
      if (!data) return;
      const incomingRev = data.__rev || 0;
      // A revision at or below the highest we've sent/seen is either our own
      // write echoing back, or a stale delivery superseded by a later local
      // write — applying it would silently revert whatever just happened
      // (a move, an upload, ...). Only ever move the revision forward.
      if (incomingRev <= lastSyncedRev) return;
      lastSyncedRev = incomingRev;
      applyIncomingState(data);
      bindTop(); renderCredits(); renderTabs(); renderPanels();
    }, (err) => {
      console.warn('db subscribe error', err);
      dbAvailable = false;
      setSyncBadge('local');
    });
  }

  async function initDb() {
    const myToken = ++dbAttemptToken;
    setSyncBadge('connecting');
    try {
      await withTimeout(attemptDbConnect(), DB_ATTEMPT_TIMEOUT_MS);
    } catch (e) {
      console.warn('db init failed', e);
      if (myToken !== dbAttemptToken) return; // a newer attempt (e.g. a manual retry click) has already taken over
      dbAvailable = false;
      fsSetDoc = null;
      // a single failed or hung attempt (a slow CDN, a brief network drop on
      // page load) shouldn't lock the page into "connecting…" or local-only
      // forever — retry a few times with a growing delay before giving up
      if (dbRetryCount < DB_MAX_RETRIES) {
        const delay = DB_RETRY_DELAYS_MS[dbRetryCount] || DB_RETRY_DELAYS_MS[DB_RETRY_DELAYS_MS.length - 1];
        dbRetryCount++;
        setSyncBadge('connecting');
        setTimeout(initDb, delay);
      } else {
        setSyncBadge('local');
      }
    }
  }

  function retryDbConnection() {
    if (dbAvailable) return;
    dbRetryCount = 0;
    initDb();
  }

  async function writeToDbNow() {
    if (!dbAvailable || !fsSetDoc) return;
    if (dbWriteInFlight) { dbWritePending = true; return; }
    dbWriteInFlight = true;
    try {
      const nextRev = (state.__rev || 0) + 1;
      state.__rev = nextRev;
      const snapshot = JSON.parse(JSON.stringify(state));
      lastSyncedRev = nextRev; // claim this revision as ours before sending, so any echo of it (or anything older) is ignored
      await fsSetDoc(snapshot);
    } catch (e) {
      console.warn('db write failed', e);
      throw e;
    } finally {
      dbWriteInFlight = false;
      if (dbWritePending) { dbWritePending = false; writeToDbNow(); }
    }
  }

  let saveTimer = null;
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* best-effort local cache */ }
    if (dbAvailable) {
      writeToDbNow()
        .then(() => { document.getElementById('saveStatus').textContent = 'משותף ✓'; })
        .catch(() => { document.getElementById('saveStatus').textContent = 'שגיאת סנכרון'; });
    } else {
      document.getElementById('saveStatus').textContent = 'נשמר';
    }
  }
  function scheduleSave() {
    document.getElementById('saveStatus').textContent = 'שומר…';
    clearTimeout(saveTimer);

  }

  function el(tag, cls, attrs) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (attrs) Object.keys(attrs).forEach(k => { if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); });
    return e;
  }

  /* ---------- auto-sizing form fields — text that overflows a fixed-size
     input/textarea is simply invisible (scrolled out of view or clipped),
     which is exactly the "text just disappears" symptom on screen, in print
     and in the PDF/Word export. These keep the box growing with the content
     instead, so what is on screen is exactly what gets exported. ---------- */
  let _measureCanvas = null;
  function measureTextWidth(text, font) {
    if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
    const ctx = _measureCanvas.getContext('2d');
    ctx.font = font;
    return ctx.measureText(text || '').width;
  }
  function autosizeInput(inputEl, minPx) {
    const cs = getComputedStyle(inputEl);
    const font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    const text = inputEl.value || inputEl.placeholder || '';
    const w = measureTextWidth(text, font) + 18; // small buffer for padding/caret
    inputEl.style.width = Math.max(minPx || 0, Math.ceil(w)) + 'px';
  }
  function autosizeTextarea(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  /* ---------- top-level fields ---------- */

    });
  }

      const nameInput = el('input', 'name');

        const box = el('div', 'wardrobe-box');
